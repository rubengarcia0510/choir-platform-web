name: Angular CI

on:
  pull_request:
    branches:
      - main
      - 124-integradora
  push:
    branches:
      - main
      - 124-integradora

permissions:
  contents: read

jobs:
  validate:
    name: Tests, build and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build Angular application
        run: npx ng build

      - name: Install axe-core
        run: npm install --no-save --package-lock=false axe-core@4.10.3

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility audit
        run: |
          npx ng serve --host 127.0.0.1 > angular-server.log 2>&1 &
          node scripts/accessibility-audit.mjs
