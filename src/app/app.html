<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="CHOIR, inicio">
      <span class="brand-mark">C</span>
      <span>CHOIR<span class="brand-dot">.</span><small>PLATAFORMA PARA DIRECTORES</small></span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/app/coro" routerLinkActive="active">Mi coro</a>
      <a routerLink="/app/conciertos" routerLinkActive="active">Conciertos</a>
      <a routerLink="/app/formaciones" routerLinkActive="active">Formaciones</a>
    </nav>

    <a class="login-link" routerLink="/ingresar">Ingresar <span aria-hidden="true">↗</span></a>
  </header>

  <main id="main-content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span class="footer-brand">CHOIR<span class="brand-dot">.</span></span>
    <span>Una mejor organización para cada voz.</span>
    <span>Plataforma en desarrollo</span>
  </footer>
</div>
