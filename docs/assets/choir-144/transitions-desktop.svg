    <text x="144" y="876" font-size="14" font-weight="700" fill="#252B25">Propuesta conceptual</text>
    <text x="144" y="900" font-size="13" fill="#747A70">La comparación, los datos y las operaciones se definirán y validarán en etapas futuras. Esta imagen no representa funcionalidad disponible.</text>
