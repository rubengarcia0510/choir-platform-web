<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Propuesta conceptual de Transiciones para escritorio</title>
  <desc id="desc">Composición conceptual con dos paneles vacíos para representar la relación entre una formación de origen y una de destino. No es una pantalla implementada.</desc>
  <defs>
