      <stop offset="0" stop-color="#00102A"/>
      <stop offset="1" stop-color="#142747"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8B879" stop-opacity=".35"/>
      <stop offset="1" stop-color="#D8B879" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="1000" fill="#FCFBF8"/>
