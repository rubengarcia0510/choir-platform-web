<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">Propuesta conceptual de Transiciones para móvil</title>
  <desc id="desc">Composición móvil apilada con dos paneles esquemáticos vacíos, uno de origen y otro de destino, conectados visualmente. No es una pantalla implementada.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00102A"/>
      <stop offset="1" stop-color="#142747"/>
    </linearGradient>
  </defs>
  <rect width="390" height="1120" fill="#FCFBF8"/>
  <rect width="390" height="64" fill="#FFFFFF"/>
  <path d="M0 63.5H390" stroke="#E9E8E1"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="22" y="40" font-size="21" font-weight="700" fill="#252B25">ChoirStage</text>
    <text x="368" y="39" font-size="11" text-anchor="end" fill="#747A70">Menú</text>

    <rect x="16" y="82" width="358" height="166" rx="18" fill="url(#hero)"/>
    <circle cx="325" cy="158" r="52" fill="none" stroke="#D8B879" stroke-opacity=".25"/>
    <circle cx="325" cy="158" r="34" fill="none" stroke="#D8B879" stroke-opacity=".35"/>
    <text x="36" y="119" font-size="10" font-weight="700" letter-spacing="1.4" fill="#D8B879">ORGANIZACIÓN ARTÍSTICA</text>
    <text x="36" y="160" font-family="Georgia,serif" font-size="29" fill="#F5F1E8">Transiciones</text>
    <text x="36" y="186" font-size="12" fill="#FFFFFF" opacity=".85">Del origen al destino.</text>
    <rect x="36" y="207" width="218" height="24" rx="12" fill="#FFFFFF" fill-opacity=".12"/>
    <text x="145" y="223" font-size="9" font-weight="700" letter-spacing=".7" text-anchor="middle" fill="#F5F1E8">CONCEPTO FUTURO · NO IMPLEMENTADO</text>

    <text x="22" y="286" font-size="10" font-weight="700" letter-spacing="1.3" fill="#747A70">RELACIÓN ENTRE FORMACIONES</text>
    <text x="22" y="319" font-family="Georgia,serif" font-size="24" fill="#252B25">Origen y destino</text>
    <text x="22" y="342" font-size="11" fill="#747A70">Vista conceptual, sin datos reales</text>

    <rect x="16" y="365" width="358" height="252" rx="16" fill="#FFFFFF" stroke="#E9E8E1"/>
    <rect x="34" y="383" width="88" height="24" rx="12" fill="#F5F1E8"/>
    <text x="78" y="399" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle" fill="#747A70">PUNTO A</text>
    <text x="34" y="441" font-family="Georgia,serif" font-size="21" fill="#252B25">Formación de origen</text>
    <text x="34" y="462" font-size="11" fill="#747A70">Referencia visual inicial</text>
    <rect x="34" y="482" width="322" height="112" rx="10" fill="#FCFBF8" stroke="#E9E8E1"/>
    <rect x="57" y="497" width="276" height="82" rx="6" fill="none" stroke="#D7D8D0" stroke-dasharray="5 5"/>
    <path d="M195 497V579 M57 538H333" stroke="#E9E8E1" stroke-dasharray="3 5"/>
    <circle cx="195" cy="538" r="21" fill="none" stroke="#D8B879" stroke-width="1.8"/>
    <text x="195" y="542" text-anchor="middle" font-size="10" fill="#747A70">A</text>

    <path d="M195 630V671" stroke="#D8B879" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M185 660L195 672L205 660" fill="none" stroke="#D8B879" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="218" y="654" font-size="9" font-weight="700" letter-spacing=".7" fill="#747A70">CAMBIO</text>

    <rect x="16" y="688" width="358" height="252" rx="16" fill="#FFFFFF" stroke="#E9E8E1"/>
    <rect x="34" y="706" width="88" height="24" rx="12" fill="#EAF0E9"/>
    <text x="78" y="722" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle" fill="#456B4C">PUNTO B</text>
    <text x="34" y="764" font-family="Georgia,serif" font-size="21" fill="#252B25">Formación de destino</text>
    <text x="34" y="785" font-size="11" fill="#747A70">Referencia visual final</text>
    <rect x="34" y="805" width="322" height="112" rx="10" fill="#FCFBF8" stroke="#E9E8E1"/>
    <rect x="57" y="820" width="276" height="82" rx="6" fill="none" stroke="#D7D8D0" stroke-dasharray="5 5"/>
    <path d="M195 820V902 M57 861H333" stroke="#E9E8E1" stroke-dasharray="3 5"/>
    <circle cx="195" cy="861" r="21" fill="none" stroke="#456B4C" stroke-width="1.8"/>
    <text x="195" y="865" text-anchor="middle" font-size="10" fill="#747A70">B</text>

    <rect x="16" y="962" width="358" height="112" rx="14" fill="#F5F1E8"/>
    <circle cx="42" cy="991" r="11" fill="#D8B879" fill-opacity=".35"/>
    <text x="42" y="995" text-anchor="middle" font-size="12" font-weight="700" fill="#252B25">i</text>
    <text x="62" y="995" font-size="12" font-weight="700" fill="#252B25">Propuesta conceptual</text>
    <text x="34" y="1023" font-size="11" fill="#747A70">Los datos, la comparación y las operaciones</text>
    <text x="34" y="1041" font-size="11" fill="#747A70">se definirán y validarán en etapas futuras.</text>
    <text x="34" y="1059" font-size="11" fill="#747A70">No representa funcionalidad disponible.</text>
    <text x="22" y="1098" font-size="9" fill="#747A70">CHOIR-144 · Propuesta estática · Móvil</text>
  </g>
</svg>
