<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc">
  <title id="title">Propuesta conceptual de Formaciones para móvil</title>
  <desc id="desc">Maqueta móvil del editor de formaciones con selectores de coro, concierto, obra y formación, escenario e integrantes.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#252B25}
      .muted{fill:#747A70}.small{font-size:12px}.label{font-size:13px;font-weight:600}
      .card{fill:#fff;stroke:#E9E8E1;stroke-width:1.3}.field{fill:#FCFBF8;stroke:#E9E8E1;stroke-width:1.2}
      .green{fill:#456B4C}.white{fill:#fff}
    </style>
  </defs>
  <rect width="390" height="1160" fill="#FCFBF8"/>
  <rect width="390" height="64" fill="#fff"/>
