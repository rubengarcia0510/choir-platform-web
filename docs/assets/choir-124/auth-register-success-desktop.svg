ext-anchor="start" letter-spacing="0" >ingresar a tu espacio.</text><rect x="820" y="494" width="360" height="52" rx="10" fill="#456B4C" stroke="none" stroke-width="0" /><text x="1000.0" y="526.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ir a ingresar</text><rect x="760" y="616" width="480" height="70" rx="8" fill="none" stroke="#7A6A3E" stroke-width="1" stroke-dasharray="5 4"/><text x="774" y="635" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="700" fill="#6B5A2E" text-anchor="start" letter-spacing="0.8" >NOTA DE REVISIÓN · NO FORMA PARTE DEL DISEÑO</text><text x="774" y="654" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Estado propuesto: asume verificación de correo.</text><text x="774" y="671" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >A confirmar contra el contrato real del backend.</text></svg>