<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="t d"><title id="t">CHOIR · Mi coro, estados (referencia visual)</title><desc id="d">Estados de Mi coro: cargando, sin coros, errores, edición, confirmación de archivo, archivado y acciones en curso.</desc><rect x="0" y="0" width="1440" height="1250" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="70" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="28" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="-1" opacity="1">Mi coro — estados visuales</text><text x="64" y="98" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Referencia conceptual de CHOIR-124. Textos tomados de la pantalla actual; sin funciones nuevas.</text><text x="64" y="146" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">CARGANDO</text><rect x="64" y="160" width="640" height="104" rx="18" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="120" y="218" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="-0.7" opacity="1">Cargando tus coros…</text><circle cx="92" cy="212" r="11" fill="none" stroke="#E9E8E1" stroke-width="3"/><path d="M92 201 A11 11 0 0 1 103 212" fill="none" stroke="#456B4C" stroke-width="3" stroke-linecap="round"/><text x="64" y="288" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Se anuncia con role=status; reemplaza al formulario y al listado mientras consulta.</text><text x="736" y="146" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">SIN COROS</text><rect x="736" y="160" width="640" height="262" rx="18" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="762" y="196" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.7" opacity="1">TUS AGRUPACIONES</text><text x="762" y="228" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="-0.7" opacity="1">Coros</text><circle cx="1335" cy="210" r="15" fill="#EDF2EB"/><text x="1335" y="215" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="800" fill="#456B4C" text-anchor="middle" letter-spacing="0" opacity="1">0</text><line x1="762" y1="248.5" x2="1350" y2="248.5" stroke="#E9E8E1"/><circle cx="790" cy="292" r="26" fill="#EDF2EB"/><text x="790" y="302" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-weight="400" fill="#456B4C" text-anchor="middle" letter-spacing="0" opacity="1">♫</text><text x="762" y="352" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Todavía no hay coros</text><text x="762" y="376" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Creá tu primera agrupación con el formulario.</text><text x="736" y="446" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">El formulario «Crear un coro» sigue visible junto al listado vacío.</text><text x="64" y="330" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">ERRORES DE CARGA Y ARCHIVO</text><rect x="64" y="346" width="640" height="56" rx="10" fill="#FFF7F5" stroke="#E8C9C5" stroke-width="1" opacity="1"/><circle cx="84" cy="374.0" r="9" fill="#922F2F"/><text x="84" y="378.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">!</text><text x="102" y="378.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="500" fill="#922F2F" text-anchor="start" letter-spacing="0" opacity="1">No pudimos cargar los coros. Revisá la conexión e intentá nuevamente.</text><rect x="594" y="352" width="100" height="44" rx="11" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="644.0" y="378.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="750" fill="#252B25" text-anchor="middle" letter-spacing="0" opacity="1">Reintentar</text><rect x="64" y="420" width="640" height="56" rx="10" fill="#FFF7F5" stroke="#E8C9C5" stroke-width="1" opacity="1"/><circle cx="84" cy="448.0" r="9" fill="#922F2F"/><text x="84" y="452.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">!</text><text x="102" y="452.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="500" fill="#922F2F" text-anchor="start" letter-spacing="0" opacity="1">No pudimos archivar el coro. Intentá nuevamente.</text><text x="64" y="506" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Banner con role=alert, ícono y texto (no solo color). Solo la carga ofrece «Reintentar».</text><text x="736" y="498" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">ERROR DE FORMULARIO</text><rect x="736" y="512" width="465" height="300" rx="18" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="762" y="548" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.7" opacity="1">NUEVA AGRUPACIÓN</text><text x="762" y="580" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="-0.7" opacity="1">Crear un coro</text><text x="762" y="624" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Nombre del coro</text><rect x="762.5" y="633.5" width="412" height="43" rx="10" fill="#FFFFFF" stroke="#922F2F" stroke-width="2" opacity="1"/><circle cx="772" cy="706" r="8" fill="#922F2F"/><text x="772" y="710" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">!</text><text x="786" y="710" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#922F2F" text-anchor="start" letter-spacing="0" opacity="1">El nombre del coro es obligatorio.</text><rect x="762" y="732" width="126" height="47" rx="11" fill="#456B4C" stroke="none" stroke-width="1" opacity="0.55"/><text x="825.0" y="760.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Crear coro</text><text x="64" y="836" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">EDICIÓN</text><rect x="64" y="850" width="465" height="370" rx="18" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="90" y="886" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.7" opacity="1">EDITAR AGRUPACIÓN</text><text x="90" y="918" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="-0.7" opacity="1">Editar coro</text><text x="90" y="962" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Nombre del coro</text><rect x="90.5" y="971.5" width="412" height="43" rx="10" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="103" y="998" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Coro de Cámara Aurora</text><text x="90" y="1038" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Descripción</text><rect x="90.5" y="1047.5" width="412" height="101" rx="10" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="103" y="1074" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Repertorio a cappella para voces mixtas,</text><text x="103" y="1098" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">con ensayos semanales.</text><rect x="90" y="1162" width="150" height="47" rx="11" fill="#456B4C" stroke="none" stroke-width="1" opacity="1"/><text x="165.0" y="1190.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Guardar cambios</text><rect x="250" y="1162" width="100" height="47" rx="11" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="300.0" y="1190.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#252B25" text-anchor="middle" letter-spacing="0" opacity="1">Cancelar</text><text x="560" y="836" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">ARCHIVO Y ARCHIVADO (MÓVIL)</text><rect x="560" y="850" width="342" height="400" rx="18" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><line x1="581" y1="876.5" x2="881" y2="876.5" stroke="#E9E8E1"/><text x="581" y="911" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="1">Coro de Cámara Aurora</text><text x="581" y="935" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Repertorio a cappella para voces mixtas, con</text><text x="581" y="955" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">ensayos semanales.</text><rect x="581" y="971" width="300" height="44" rx="11" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="731.0" y="997.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#252B25" text-anchor="middle" letter-spacing="0" opacity="1">Editar</text><rect x="581.5" y="1025.5" width="299" height="106" rx="12" fill="#FFF7F5" stroke="#E8C9C5" stroke-width="1" opacity="1"/><text x="595" y="1055" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="650" fill="#922F2F" text-anchor="start" letter-spacing="0" opacity="1">¿Archivar este coro?</text><rect x="593" y="1071" width="133.0" height="44" rx="11" fill="#9C3737" stroke="none" stroke-width="1" opacity="1"/><text x="659.5" y="1097.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Confirmar</text><rect x="736.0" y="1071" width="133.0" height="44" rx="11" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" opacity="1"/><text x="802.5" y="1097.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#252B25" text-anchor="middle" letter-spacing="0" opacity="1">Cancelar</text><line x1="581" y1="1149.5" x2="881" y2="1149.5" stroke="#E9E8E1"/><text x="581" y="1184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="750" fill="#252B25" text-anchor="start" letter-spacing="0" opacity="0.72">Coro Vocal Encuentro</text><rect x="773.0" y="1171" width="74" height="22" rx="11" fill="#EEEAE2" stroke="none" stroke-width="1" opacity="1"/><text x="810.0" y="1186" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="750" fill="#6B6255" text-anchor="middle" letter-spacing="0" opacity="1">Archivado</text><text x="581" y="1208" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="0.72">Sin descripción.</text><text x="940" y="836" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="800" fill="#456B4C" text-anchor="start" letter-spacing="1.5" opacity="1">ACCIONES EN CURSO</text><rect x="940" y="850" width="150" height="47" rx="11" fill="#456B4C" stroke="none" stroke-width="1" opacity="0.55"/><text x="1015.0" y="878.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Guardando…</text><text x="940" y="924" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Guardar y Cancelar se bloquean durante la operación.</text><rect x="940" y="960" width="130" height="44" rx="11" fill="#9C3737" stroke="none" stroke-width="1" opacity="0.55"/><text x="1005.0" y="986.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Archivando…</text><text x="940" y="1032" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Confirmar cambia de texto y se deshabilita.</text><rect x="940" y="1068" width="126" height="47" rx="11" fill="#456B4C" stroke="none" stroke-width="1" opacity="0.55"/><text x="1003.0" y="1096.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="750" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">Crear coro</text><text x="940" y="1142" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#747A70" text-anchor="start" letter-spacing="0" opacity="1">Deshabilitado mientras el nombre está vacío.</text></svg>