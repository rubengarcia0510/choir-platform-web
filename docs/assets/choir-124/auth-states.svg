<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" role="img" aria-labelledby="t d"><title id="t">CHOIR-124 · Estados visuales de Ingresar y Registro (propuesta)</title><desc id="d">Hoja de estados: campo en reposo, foco, error, deshabilitado y carga; botón en cinco estados; mensajes de error; validación de registro; éxito pendiente.</desc><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1" /><text x="64" y="70" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="28" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >CHOIR-124 · Ingresar y Registro — estados visuales</text><text x="64" y="98" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >Propuesta conceptual. Los estados de foco, error, carga y deshabilitado se definen para ambos formularios.</text><text x="64" y="150" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#456B4C" text-anchor="start" letter-spacing="1.4" >CAMPO DE TEXTO</text><text x="64" y="184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Reposo</text><text x="64" y="214" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Correo electrónico</text><rect x="64" y="224" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#8A9086" stroke-width="1.5" /><text x="340" y="184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Foco (teclado)</text><text x="340" y="214" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Correo electrónico</text><rect x="336" y="220" width="248" height="56" rx="13" fill="none" stroke="#456B4C" stroke-width="2" opacity=".28"/><rect x="340" y="224" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#456B4C" stroke-width="2" /><text x="356" y="254" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >director@</text><rect x="433.4" y="237" width="1.6" height="22" rx="0" fill="#252B25" stroke="none" stroke-width="1" /><text x="616" y="184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Error asociado al campo</text><text x="616" y="214" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Correo electrónico</text><rect x="616" y="224" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#A12C2C" stroke-width="2" /><text x="632" y="254" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >director@</text><circle cx="624" cy="291" r="8" fill="#A12C2C"/><text x="624" y="295.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >!</text><text x="640" y="296" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="500" fill="#A12C2C" text-anchor="start" letter-spacing="0" >Ingresá un correo electrónico válido.</text><text x="892" y="184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Deshabilitado</text><text x="892" y="214" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Correo electrónico</text><rect x="892" y="224" width="240" height="48" rx="10" fill="#F1F0EA" stroke="#C9CCC4" stroke-width="1.5" /><text x="908" y="254" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >director@ejemplo.org</text><text x="1168" y="184" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Carga (campos bloqueados)</text><text x="1168" y="214" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Correo electrónico</text><rect x="1168" y="224" width="240" height="48" rx="10" fill="#F1F0EA" stroke="#C9CCC4" stroke-width="1.5" /><text x="1184" y="254" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >director@ejemplo.org</text><text x="64" y="400" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#456B4C" text-anchor="start" letter-spacing="1.4" >BOTÓN PRINCIPAL</text><text x="64" y="434" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Reposo</text><rect x="64" y="452" width="240" height="52" rx="10" fill="#456B4C" stroke="none" stroke-width="0" /><text x="184.0" y="484.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ingresar</text><text x="340" y="434" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Hover</text><rect x="340" y="452" width="240" height="52" rx="10" fill="#3A5B41" stroke="none" stroke-width="0" /><text x="460.0" y="484.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ingresar</text><text x="616" y="434" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Foco (teclado)</text><rect x="612" y="448" width="248" height="60" rx="14" fill="none" stroke="#252B25" stroke-width="2" /><rect x="616" y="452" width="240" height="52" rx="10" fill="#456B4C" stroke="none" stroke-width="0" /><text x="736.0" y="484.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ingresar</text><text x="892" y="434" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Carga</text><rect x="892" y="452" width="240" height="52" rx="10" fill="#456B4C" stroke="none" stroke-width="0" /><circle cx="950.0" cy="478.0" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".35"/><path d="M950.0 470.0 A8 8 0 0 1 958.0 478.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="1024.0" y="484.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ingresando…</text><text x="1168" y="434" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="600" fill="#5F655C" text-anchor="start" letter-spacing="0" >Deshabilitado</text><rect x="1168" y="452" width="240" height="52" rx="10" fill="#E4E5DE" stroke="none" stroke-width="0" /><text x="1288.0" y="484.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#5F655C" text-anchor="middle" letter-spacing="0" >Ingresar</text><text x="64" y="570" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#456B4C" text-anchor="start" letter-spacing="1.4" >MENSAJES DE LA OPERACIÓN (role=alert)</text><rect x="64" y="590" width="620" height="76" rx="10" fill="#FBF1F1" stroke="none" stroke-width="0" /><rect x="64" y="590" width="5" height="76" rx="2" fill="#A12C2C" stroke="none" stroke-width="0" /><circle cx="98" cy="628" r="11" fill="#A12C2C"/><text x="98" y="633" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >!</text><text x="122" y="623" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="500" fill="#252B25" text-anchor="start" letter-spacing="0" >No se pudo iniciar sesión. Verificá el correo, la contraseña</text><text x="122" y="643" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="500" fill="#252B25" text-anchor="start" letter-spacing="0" >y que el correo esté verificado.</text><rect x="724" y="590" width="620" height="76" rx="10" fill="#FBF1F1" stroke="none" stroke-width="0" /><rect x="724" y="590" width="5" height="76" rx="2" fill="#A12C2C" stroke="none" stroke-width="0" /><circle cx="758" cy="628" r="11" fill="#A12C2C"/><text x="758" y="633" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >!</text><text x="782" y="623" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="500" fill="#252B25" text-anchor="start" letter-spacing="0" >No se pudo conectar con el servidor.</text><text x="782" y="643" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="500" fill="#252B25" text-anchor="start" letter-spacing="0" >Intentá nuevamente.</text><text x="64" y="712" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#456B4C" text-anchor="start" letter-spacing="1.4" >REGISTRO — VALIDACIÓN Y ÉXITO</text><text x="64" y="736" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#252B25" text-anchor="start" letter-spacing="0" >Nombre para mostrar</text><rect x="64" y="746" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#A12C2C" stroke-width="2" /><circle cx="72" cy="813" r="8" fill="#A12C2C"/><text x="72" y="817.5" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >!</text><text x="88" y="818" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="500" fill="#A12C2C" text-anchor="start" letter-spacing="0" >Este campo es obligatorio.</text><text x="64" y="858" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >Texto de error propuesto; el copy final depende de las validaciones reales.</text><rect x="340" y="736" width="560" height="110" rx="10" fill="none" stroke="#7A6A3E" stroke-width="1" stroke-dasharray="5 4"/><text x="360" y="762" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="700" fill="#6B5A2E" text-anchor="start" letter-spacing="0.8" >ESTADO DE RESPUESTA 202 — PROPUESTO (VER AUTH-REGISTER-SUCCESS)</text><text x="360" y="788" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >La respuesta 202 utiliza un mensaje neutral sobre los próximos pasos.</text><text x="360" y="808" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >No confirma por sí sola el envío del correo ni inicia sesión.</text><rect x="930" y="736" width="446" height="128" rx="12" fill="#FFFFFF" stroke="#E9E8E1" stroke-width="1" /><text x="950" y="762" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#252B25" text-anchor="start" letter-spacing="0" >Contraste calculado (sin pruebas manuales)</text><text x="950" y="786" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Texto secundario actual #747A70 / blanco</text><text x="1366" y="786" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#252B25" text-anchor="end" letter-spacing="0" >4.41:1 — bajo 4.5:1</text><text x="950" y="801" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Texto secundario actual #747A70 / #FCFBF8</text><text x="1366" y="801" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#252B25" text-anchor="end" letter-spacing="0" >4.26:1 — bajo 4.5:1</text><text x="950" y="816" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Propuesto #5F655C / #FCFBF8</text><text x="1366" y="816" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#252B25" text-anchor="end" letter-spacing="0" >5.79:1</text><text x="950" y="831" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Borde actual #E9E8E1 / blanco</text><text x="1366" y="831" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#252B25" text-anchor="end" letter-spacing="0" >1.23:1 — bajo 3:1 (campos)</text><text x="950" y="846" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Propuesto #8A9086 / blanco</text><text x="1366" y="846" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#252B25" text-anchor="end" letter-spacing="0" >3.27:1</text><text x="64" y="930" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Reglas comunes: etiqueta visible siempre; error con icono + texto (no solo color); aria-invalid y aria-describedby enlazan campo y mensaje;</text><text x="64" y="952" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >el foco usa borde de 2 px más halo y nunca depende solo del color; el botón en carga evita envíos duplicados y mantiene su ancho.</text><text x="64" y="1010" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >Verde #456B4C sobre blanco: 6.07:1. Rojo de error existente #A12C2C sobre blanco: 7.21:1. Valores calculados; la conformidad WCAG 2.2 AA requiere pruebas.</text></svg>