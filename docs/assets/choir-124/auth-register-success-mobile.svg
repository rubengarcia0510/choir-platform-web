<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="t d">
  <title id="t">CHOIR-124 · Solicitud de registro — móvil (propuesta)</title>
  <desc id="d">Propuesta visual conceptual. Informa que, si el registro está disponible, se recibirán los próximos pasos por correo. No confirma la creación de una cuenta ni el envío efectivo de un mensaje.</desc>
  <rect width="390" height="844" fill="#FCFBF8"/>
  <rect width="390" height="120" fill="#00102A"/>
  <g fill="none" stroke="#D8B879" stroke-linecap="round" opacity=".5">
    <path d="M0 84 C98 66 156 102 234 84 S351 66 390 93"/>
    <path d="M0 91 C98 63 156 119 234 91 S351 63 390 105"/>
    <path d="M0 98 C98 60 156 136 234 98 S351 60 390 117"/>
  </g>
  <text x="24" y="54" font-family="Georgia,serif" font-size="22" fill="#D8B879" letter-spacing="6.16">CHOIR</text>
  <circle cx="52" cy="188" r="28" fill="#EAF0EB"/>
  <g fill="none" stroke="#456B4C" stroke-width="2" stroke-linejoin="round">
    <rect x="38" y="178" width="28" height="20" rx="3"/>
    <path d="M38 181 L52 191 L66 181"/>
  </g>
  <text x="24" y="238" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#456B4C" letter-spacing="1.4">SOLICITUD RECIBIDA</text>
  <text x="24" y="278" font-family="Georgia,serif" font-size="28" fill="#252B25">Próximos pasos</text>
  <text x="24" y="312" font-family="Arial,sans-serif" font-size="15" fill="#5F655C">Si corresponde, vas a</text>
  <text x="24" y="334" font-family="Arial,sans-serif" font-size="15" fill="#5F655C">recibir un correo con los próximos</text>
  <text x="24" y="356" font-family="Arial,sans-serif" font-size="15" fill="#5F655C">pasos. Revisá tu bandeja de entrada.</text>
  <rect x="24" y="396" width="342" height="52" rx="10" fill="#456B4C"/>
  <text x="195" y="428" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ir a ingresar</text>
</svg>
