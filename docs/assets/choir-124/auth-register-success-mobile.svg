ound"><rect x="38" y="178" width="28" height="20" rx="3"/><path d="M38 181 L52 191 L66 181"/></g><text x="24" y="238" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#456B4C" text-anchor="start" letter-spacing="1.4" >REGISTRO RECIBIDO</text><text x="24" y="278" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="28" font-weight="400" fill="#252B25" text-anchor="start" letter-spacing="0" >Revisá tu correo.</text><text x="24" y="312" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >Para terminar de crear tu cuenta, verificá</text><text x="24" y="334" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >tu correo electrónico. Después vas a poder</text><text x="24" y="356" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" fill="#5F655C" text-anchor="start" letter-spacing="0" >ingresar a tu espacio.</text><rect x="24" y="396" width="342" height="52" rx="10" fill="#456B4C" stroke="none" stroke-width="0" /><text x="195.0" y="428.0" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >Ir a ingresar</text><rect x="24" y="478" width="342" height="70" rx="8" fill="none" stroke="#7A6A3E" stroke-width="1" stroke-dasharray="5 4"/><text x="38" y="497" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="10" font-weight="700" fill="#6B5A2E" text-anchor="start" letter-spacing="0.8" >NOTA DE REVISIÓN · NO FORMA PARTE DEL DISEÑO</text><text x="38" y="516" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#